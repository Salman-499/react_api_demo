services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: "http://localhost,http://localhost:5173"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
